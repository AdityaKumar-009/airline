spring.application.name=auth-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:mysql://localhost:3306/airline_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.api-docs.enabled=true
jwt.public-key=file:./keys/public.pem
jwt.private-key=file:./keys/private.pem
demo.admin.password=${DEMO_ADMIN_PASSWORD:Admin@12345}
demo.customer.password=${DEMO_CUSTOMER_PASSWORD:Customer@12345}
