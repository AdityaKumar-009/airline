spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[1].id=flights
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://flight-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/flights/**,/api/flights
spring.cloud.gateway.server.webmvc.routes[2].id=bookings
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**,/api/bookings
spring.cloud.gateway.server.webmvc.routes[3].id=auth-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/docs/auth
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].id=flight-docs
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://flight-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/docs/flights
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].id=booking-docs
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/docs/bookings
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Authentication
springdoc.swagger-ui.urls[0].url=/docs/auth
springdoc.swagger-ui.urls[1].name=Flights
springdoc.swagger-ui.urls[1].url=/docs/flights
springdoc.swagger-ui.urls[2].name=Bookings
springdoc.swagger-ui.urls[2].url=/docs/bookings
springdoc.swagger-ui.disable-swagger-default-url=true
