name: Temporary integration verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: npm
          cache-dependency-path: airline-frontend/package-lock.json
      - name: Compile and unit test Java
        run: mvn -B clean package
      - name: Build Angular app
        working-directory: airline-frontend
        run: |
          npm ci
          npm run build
      - name: Start services and verify migrations and booking workflow
        shell: bash
        run: |
          set -euo pipefail
          java tools/GenerateKeys.java
          trap 'for file in /tmp/{discovery,auth,flight,booking,gateway}.log; do if [ -f "$file" ]; then echo "== $file =="; head -100 "$file"; tail -100 "$file"; fi; done' ERR
          wait_http() {
            local service="$1"
            local url="$2"
            local logfile="$3"
            for i in {1..80}; do
              if curl -fsS --max-time 2 "$url" >/dev/null 2>&1; then
                echo "$service ready"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $service"
            head -150 "$logfile" || true
            tail -150 "$logfile" || true
            return 1
          }
          java -Xmx384m -jar discovery-server/target/discovery-server-1.0.0.jar > /tmp/discovery.log 2>&1 &
          wait_http discovery http://localhost:8761/ /tmp/discovery.log
          java -Xmx384m -jar auth-service/target/auth-service-1.0.0.jar --eureka.instance.hostname=localhost > /tmp/auth.log 2>&1 &
          wait_http auth http://localhost:8081/v3/api-docs /tmp/auth.log
          java -Xmx384m -jar flight-service/target/flight-service-1.0.0.jar --eureka.instance.hostname=localhost > /tmp/flight.log 2>&1 &
          wait_http flight http://localhost:8082/api/flights /tmp/flight.log
          java -Xmx384m -jar booking-service/target/booking-service-1.0.0.jar --eureka.instance.hostname=localhost > /tmp/booking.log 2>&1 &
          wait_http booking 'http://localhost:8083/api/bookings/seats?flightId=1' /tmp/booking.log
          java -Xmx384m -jar api-gateway/target/api-gateway-1.0.0.jar --eureka.instance.hostname=localhost > /tmp/gateway.log 2>&1 &
          wait_http gateway http://localhost:8080/api/flights /tmp/gateway.log
          curl -sf http://localhost:8080/api/flights/airports | jq -e 'length >= 8'
          CUSTOMER_TOKEN=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"customer@airline.test","password":"Customer@12345"}' \
            http://localhost:8080/api/auth/login | jq -r '.token')
          test -n "$CUSTOMER_TOKEN"
          BOOKING=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            -d '{"flightId":1,"contactEmail":"test@example.test","passengers":[{"fullName":"Demo One","age":24,"seatNumber":1},{"fullName":"Demo Two","age":25,"seatNumber":2}]}' \
            http://localhost:8080/api/bookings)
          echo "$BOOKING" | jq -e '.pnr | length == 8'
          echo "$BOOKING" | jq -e '.passengers | length == 2'
          BOOKING_ID=$(echo "$BOOKING" | jq -r '.id')
          curl -sf -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            http://localhost:8080/api/bookings/me | jq -e 'length > 0'
          curl -sf -X PATCH -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            http://localhost:8080/api/bookings/"$BOOKING_ID"/cancel \
            | jq -e '.status == "CANCELLED"'
          curl -sf 'http://localhost:8080/api/bookings/seats?flightId=1' | jq -e 'length == 0'
          ADMIN_TOKEN=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"admin@airline.test","password":"Admin@12345"}' \
            http://localhost:8080/api/auth/login | jq -r '.token')
          curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://localhost:8080/api/flights/manage | jq -e 'length > 0'
      - name: Show service logs if job fails
        if: failure()
        run: |
          for file in /tmp/{discovery,auth,flight,booking,gateway}.log; do
            if [ -f "$file" ]; then echo "== $file =="; tail -120 "$file"; fi
          done
