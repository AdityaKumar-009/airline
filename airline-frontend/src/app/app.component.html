<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()">Skip to content</a>
<header class="topbar">
  <div class="container nav">
    <a class="brand" routerLink="/flights" aria-label="AirlineMS home">
      <app-airplane-icon class="brand-icon" />
      <span>AirlineMS</span>
    </a>

    <nav class="primary-nav" aria-label="Main navigation">
      <a class="nav-link" routerLink="/flights" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Flights</a>
      @if(auth.role()==='CUSTOMER'){
        <a class="nav-link" routerLink="/my-bookings" routerLinkActive="active" ariaCurrentWhenActive="page">My bookings</a>
        <a class="nav-link" routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">My profile</a>
      }
      @if(auth.role()==='ADMIN'){
        <a class="nav-link" routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Administration</a>
      }
    </nav>
    <div class="account-nav">
      @if(auth.token()){
        <span class="welcome">{{auth.name()}}</span>
        <button class="text-button logout-button" (click)="logout()">Log out</button>
      } @else {
        <a class="secondary nav-login" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Log in</a>
      }
    </div>
  </div>
</header>

<main #mainContent id="main-content" class="container page" tabindex="-1">
  <router-outlet />
</main>

<footer class="container footer">
  <span>AirlineMS</span>
</footer>
