<header class="topbar">
  <div class="container nav">
    <a class="brand" routerLink="/flights" aria-label="AirlineMS home">
      <span class="brand-icon" aria-hidden="true">✈</span>
      <span>AirlineMS</span>
    </a>

    <nav aria-label="Main navigation">
      <a class="nav-link" routerLink="/flights" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}">Flights</a>
      @if(auth.role()==='CUSTOMER'){
        <a class="nav-link" routerLink="/my-bookings" routerLinkActive="active">My Bookings</a>
        <a class="nav-link" routerLink="/profile" routerLinkActive="active">My Profile</a>
      }
      @if(auth.role()==='ADMIN'){
        <a class="nav-link" routerLink="/admin" routerLinkActive="active">Manage Flights</a>
      }
      @if(auth.token()){
        <span class="welcome">{{auth.name()}}</span>
        <button class="text-button logout-button" (click)="logout()">Log out</button>
      } @else {
        <a class="nav-login" routerLink="/login" routerLinkActive="active">Log in</a>
      }
    </nav>
  </div>
</header>

<main class="container page">
  <router-outlet />
</main>

<footer class="container footer">
  <span>AirlineMS</span>
  <span>Student demonstration · No payments</span>
</footer>
